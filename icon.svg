<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="naranjaForja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A29" />
      <stop offset="100%" stop-color="#E6580A" />
    </linearGradient>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17171A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fondo Papel Forja v2 (#F3F0E8) con radio 108 px para icono maskable/standalone -->
  <rect width="512" height="512" rx="108" fill="#F3F0E8" />

  <!-- Yunque y mancuerna editorial estilizada en naranja forja y tinta -->
  <g filter="url(#sombraSuave)" transform="translate(0, 4)">
    <!-- Cuerpo principal del yunque en naranja forja -->
    <path d="M 125 185
             C 125 170, 135 160, 150 160
             L 390 160
             C 405 160, 415 170, 410 185
             L 395 230
             C 390 240, 380 245, 365 248
             L 315 255
             C 290 260, 275 275, 275 300
             L 275 320
             L 345 340
             C 360 345, 370 358, 370 375
             L 370 390
             C 370 400, 360 408, 345 408
             L 135 408
             C 120 408, 110 400, 110 390
             L 110 375
             C 110 358, 120 345, 135 340
             L 205 320
             L 205 300
             C 205 275, 190 260, 165 255
             L 130 248
             C 110 242, 95 230, 90 210
             C 85 190, 105 180, 125 185 Z"
          fill="url(#naranjaForja)" />

    <!-- Cuerno afilado del yunque -->
    <path d="M 135 160
             C 85 170, 50 195, 38 215
             C 34 222, 41 230, 50 228
             C 80 220, 115 235, 130 248
             Z"
          fill="url(#naranjaForja)" />

    <!-- Cara superior de golpeo con brillo sutil -->
    <path d="M 152 172 L 388 172 C 395 172, 400 177, 397 185 L 390 202 L 142 202 Z"
          fill="#FFF3EB" opacity="0.4" />

    <!-- Pesa / Mancuerna central integrada en color Tinta (#17171A) -->
    <g transform="translate(240, 312)">
      <!-- Barra de agarre -->
      <rect x="-34" y="-5" width="68" height="10" rx="4" fill="#17171A" />
      <!-- Discos internos -->
      <rect x="-44" y="-18" width="10" height="36" rx="4" fill="#17171A" />
      <rect x="34" y="-18" width="10" height="36" rx="4" fill="#17171A" />
      <!-- Discos externos -->
      <rect x="-56" y="-24" width="10" height="48" rx="4" fill="#17171A" />
      <rect x="46" y="-24" width="10" height="48" rx="4" fill="#17171A" />
    </g>

    <!-- Chispa de acento lima de tiza (#C8F03C) con trazo tinta -->
    <path d="M 405 130
             C 405 115, 415 105, 415 105
             C 415 105, 425 115, 425 130
             C 425 145, 415 155, 415 155
             C 415 155, 405 145, 405 130 Z"
          fill="#C8F03C" stroke="#17171A" stroke-width="3" />
    <circle cx="438" cy="112" r="5" fill="#C8F03C" />
  </g>
</svg>
