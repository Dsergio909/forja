<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F3F0E8">
  <meta name="description" content="Forja - App personal de entrenamiento, progreso físico y nutrición sin conexión.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="fonts/fuentes.css">
  <link rel="stylesheet" href="styles.css">
  <title>Forja</title>
</head>
<body>
  <div id="app">
    <!-- Capa de grano sutil editorial -->
    <div class="grain-layer" aria-hidden="true"></div>

    <!-- Cabecera limpia común: título en Instrument Serif, botones con iconos SVG -->
    <header id="cabecera">
      <div class="cabecera-logo-titulo">
        <h1 id="titulo-pantalla">Forja</h1>
      </div>
      <div class="cabecera-acciones">
        <a href="#coach" class="btn-icono-cabecera" id="btn-coach" title="Coach" aria-label="Coach"></a>
        <a href="#ajustes" class="btn-icono-cabecera" id="btn-ajustes" title="Ajustes" aria-label="Ajustes"></a>
      </div>
    </header>

    <!-- Contenedor dinámico donde se monta la pantalla activa -->
    <main id="vista" role="main"></main>

    <!-- Barra de navegación flotante inferior en píldora tinta con activo en círculo lima -->
    <nav id="barra-abajo" class="floating-navbar" aria-label="Navegación principal">
      <a href="#hoy" class="nav-item active" data-hash="hoy" aria-label="Hoy" title="Hoy">
        <span class="nav-icono" data-icono-nav="hoy"></span>
      </a>
      <a href="#registrar" class="nav-item" data-hash="registrar" aria-label="Registrar" title="Registrar">
        <span class="nav-icono" data-icono-nav="registrar"></span>
      </a>
      <a href="#progreso" class="nav-item" data-hash="progreso" aria-label="Progreso" title="Progreso">
        <span class="nav-icono" data-icono-nav="progreso"></span>
      </a>
      <a href="#cuerpo" class="nav-item" data-hash="cuerpo" aria-label="Cuerpo" title="Cuerpo">
        <span class="nav-icono" data-icono-nav="cuerpo"></span>
      </a>
      <a href="#guia" class="nav-item" data-hash="guia" aria-label="Guía" title="Guía">
        <span class="nav-icono" data-icono-nav="guia"></span>
      </a>
    </nav>

    <!-- Contenedor para notificaciones flotantes (toasts) -->
    <div id="contenedor-avisos" aria-live="polite"></div>

    <!-- Contenedor para modales y diálogos -->
    <div id="contenedor-dialogos"></div>
  </div>

  <!-- Arranque del router y la aplicación -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
